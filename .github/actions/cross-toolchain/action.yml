name: Cross toolchain + sources
description: >
  For one matrix compiler: restore the cached GCC cross toolchain or unpack the llvm-mingw tarball, put it
  on PATH, and prepare the build inputs of ci/compiler-bench/build-variant.sh (webp4j checkout at
  ./webp4j with libwebp/ -> ./libwebp, giflib sources at ./deps/giflib, JDK, Ninja).
inputs:
  compiler:
    description: 'compiler name: gcc17, gcc16, clang-nightly, clang23 (llvm-mingw also targets ARM64)'
    required: true
  toolchains:
    description: 'gcc_toolchains JSON of the resolve job (holds the cache keys)'
    default: '[]'
  deps-artifact:
    description: 'artifact with giflib/ (unpacked to ./deps)'
    default: deps
  tc-artifact:
    description: 'artifact with llvm-mingw-<compiler>.tar.xz'
    default: tc-llvm-mingw
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.deps-artifact }}
        path: deps

    - name: Set up JDK (jni.h)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Ninja
      uses: seanmiddleditch/gha-setup-ninja@v6

    - name: GCC toolchain cache key
      id: key
      if: startsWith(inputs.compiler, 'gcc')
      shell: bash
      env:
        TOOLCHAINS: ${{ inputs.toolchains }}
        COMPILER: ${{ inputs.compiler }}
      run: echo "key=$(echo "$TOOLCHAINS" | jq -r --arg c "$COMPILER" '.[] | select(.name == $c) | .key')" >> "$GITHUB_OUTPUT"

    - name: Restore the GCC cross toolchain
      if: startsWith(inputs.compiler, 'gcc')
      uses: actions/cache/restore@v4
      with:
        path: ~/tc/mingw-${{ inputs.compiler }}
        key: ${{ steps.key.outputs.key }}
        fail-on-cache-miss: true

    - name: Get llvm-mingw
      if: startsWith(inputs.compiler, 'clang')
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.tc-artifact }}
        path: ${{ runner.temp }}/tc-dl

    - name: Put the toolchain on PATH, point webp4j/libwebp to this repository
      shell: bash
      env:
        COMPILER: ${{ inputs.compiler }}
      run: |
        set -euo pipefail
        case "$COMPILER" in
          gcc*)   echo ~/tc/mingw-$COMPILER/bin >> "$GITHUB_PATH" ;;
          clang*) mkdir -p ~/tc/llvm-mingw
                  tar -xJf "$RUNNER_TEMP/tc-dl/llvm-mingw-$COMPILER.tar.xz" -C ~/tc/llvm-mingw --strip-components=1
                  echo ~/tc/llvm-mingw/bin >> "$GITHUB_PATH" ;;
        esac
        rm -rf webp4j/libwebp && ln -s "$GITHUB_WORKSPACE/libwebp" webp4j/libwebp
