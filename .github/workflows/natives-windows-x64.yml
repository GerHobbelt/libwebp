name: Windows x64 natives (GCC snapshot vs Clang nightly) - build, test, benchmark, release

# Builds the webp4j JNI library webp4j-windows-x64.dll (drop-in for dev.matrixlab.webp4j:webp4j-core,
# libwebp = this repository) and webp_bench.exe with development compilers and picks the fastest:
#   gcc17          GCC 17 trunk weekly snapshot (gcc.gnu.org/pub/gcc/snapshots/LATEST-17); no Windows
#                  distribution ships it, so a Linux-hosted x86_64-w64-mingw32 cross toolchain is built
#                  (ci/compiler-bench/build-gcc-mingw-cross.sh: UCRT, mingw-w64 master) and cached
#   clang-nightly  llvm-mingw nightly (LLVM main, UCRT, lld) - github.com/mstorsjo/llvm-mingw
#   (input 'stable', always on 'natives-*' tags: also GCC 16.2 cross + llvm-mingw release with Clang 23)
# each in three variants (ci/compiler-bench/build-variant.sh):
#   base      webp4j's release defaults (-O3, generic x86-64, libwebp's run-time SSE2/SSE4.1/AVX2 dispatch)
#   avx2      -O3 -march=x86-64-v3 -ffast-math         (needs an AVX2/FMA/BMI2 CPU: Haswell / Zen 1+)
#   avx2-lto  avx2 + whole-program LTO
#   avx2-lto-pgo  avx2-lto + profile-guided optimization: an instrumented build (avx2-lto-pgogen) is
#             trained on Windows with images disjoint from the benchmark corpus (ci/compiler-bench/corpus.sh)
# Builds are cross-compiled on Linux; every DLL then runs webp4j's JUnit suite on a native Windows x64
# JVM, and all builds are benchmarked on ONE Windows runner in interleaved rounds
# (ci/compiler-bench/bench.py; results in the job summary + artifact).
# Release: release.yml calls this workflow with only=<benchmark winner> and bench=false; the winner's
# DLL ships as webp4j-windows-x64-avx2.dll next to the portable libraries of natives.yml.
on:
  workflow_dispatch:
    inputs:
      gcc_snapshot:
        description: 'GCC 17 snapshot (gcc-17-YYYYMMDD); empty = latest'
        default: ''
      stable:
        description: 'Also build stable GCC 16.2 + Clang 23 as references'
        type: boolean
        default: false
      only:
        description: 'Only this build, e.g. clang-nightly-avx2-lto-pgo (empty = full comparison)'
        default: ''
      bench:
        description: 'Run the benchmark'
        type: boolean
        default: true
      rounds:
        description: 'Benchmark rounds (interleaved)'
        default: '5'
  workflow_call:   # release.yml: only=<benchmark winner>, bench=false
    inputs:
      gcc_snapshot:
        type: string
        default: ''
      stable:
        type: boolean
        default: false
      only:
        type: string
        default: ''
      bench:
        type: boolean
        default: true
      rounds:
        type: string
        default: '5'

permissions:
  contents: read

concurrency:
  group: natives-windows-x64-${{ github.ref }}
  cancel-in-progress: true

env:
  BINUTILS_VER: '2.47'
  MINGW_VER: '63ebe6cdb3ec4d5c586b7f0f0c03dd502e44c296'   # mingw-w64 master (v14.0.0 CRT fails with GCC 17)
  GCC_STABLE: 'gcc-16.2.0'
  LLVM_MINGW_STABLE: '20261006'                            # LLVM 23.1.3
  WEBP4J_REF: 'v2.5.0'
  GIFLIB_REF: '5.2.2'

jobs:
  resolve:
    name: resolve compiler versions + sources
    runs-on: ubuntu-24.04
    outputs:
      gcc_toolchains: ${{ steps.r.outputs.gcc_toolchains }}
      builds: ${{ steps.r.outputs.builds }}
      tested: ${{ steps.r.outputs.tested }}
      pgo: ${{ steps.r.outputs.pgo }}
    steps:
      - uses: actions/checkout@v4

      - id: r
        name: Pick the GCC snapshot and the build matrix
        env:
          SNAP: ${{ inputs.gcc_snapshot }}
          STABLE: ${{ inputs.stable }}
          ONLY: ${{ inputs.only }}
          RECIPE: ${{ hashFiles('ci/compiler-bench/build-gcc-mingw-cross.sh') }}
        run: |
          set -euo pipefail
          if [ -n "$ONLY" ]; then
            [[ $ONLY =~ ^(gcc17|gcc16|clang-nightly|clang23)-(base|avx2|avx2-lto|avx2-lto-pgo)$ ]] \
              || { echo "::error::unknown build '$ONLY'"; exit 1; }
            comps=${BASH_REMATCH[1]} variants=${BASH_REMATCH[2]}
          else
            comps="gcc17 clang-nightly" variants="base avx2 avx2-lto avx2-lto-pgo"
            [ "$STABLE" != "true" ] || comps="$comps gcc16 clang23"
          fi
          tc() {  # name version url -> JSON (the cache key is shared by the toolchain and build jobs)
            echo "{\"name\":\"$1\",\"ver\":\"$2\",\"url\":\"$3\",\"key\":\"mingw-cross-$2-binutils$BINUTILS_VER-$MINGW_VER-$RECIPE\"},"
          }
          tcs=""
          if [[ " $comps " == *" gcc17 "* ]]; then
            if [ -z "$SNAP" ]; then
              SNAP=$(curl -fsSL --retry 5 https://gcc.gnu.org/pub/gcc/snapshots/LATEST-17/ | grep -oE 'gcc-17-[0-9]{8}' | head -1)
            fi
            test -n "$SNAP"
            tcs=$tcs$(tc gcc17 "$SNAP" "https://gcc.gnu.org/pub/gcc/snapshots/${SNAP#gcc-}/$SNAP.tar.xz")
          fi
          if [[ " $comps " == *" gcc16 "* ]]; then
            tcs=$tcs$(tc gcc16 "$GCC_STABLE" "https://gcc.gnu.org/pub/gcc/releases/$GCC_STABLE/$GCC_STABLE.tar.xz")
          fi
          builds=""; tested=""; pgo=""   # build job / test + bench / PGO training + profile-use jobs
          for c in $comps; do
            for v in $variants; do
              b=$v; [ "$v" != avx2-lto-pgo ] || { b=avx2-lto-pgogen; pgo="$pgo\"$c\","; }
              builds="$builds{\"compiler\":\"$c\",\"variant\":\"$b\"},"
              tested="$tested{\"compiler\":\"$c\",\"variant\":\"$v\"},"
            done
          done
          echo "comps=$comps" >> "$GITHUB_OUTPUT"
          echo "gcc_toolchains=[${tcs%,}]" >> "$GITHUB_OUTPUT"
          echo "builds=[${builds%,}]" >> "$GITHUB_OUTPUT"
          echo "tested=[${tested%,}]" >> "$GITHUB_OUTPUT"
          echo "pgo=[${pgo%,}]" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Download llvm-mingw and giflib once (the nightly asset is replaced daily)
        env:
          COMPS: ${{ steps.r.outputs.comps }}
        run: |
          set -euo pipefail
          mkdir -p tc deps
          if [[ " $COMPS " == *" clang-nightly "* ]]; then
            curl -fsSL --retry 5 -o tc/llvm-mingw-clang-nightly.tar.xz \
              https://github.com/mstorsjo/llvm-mingw/releases/download/nightly/llvm-mingw-nightly-ucrt-ubuntu-22.04-x86_64.tar.xz
          fi
          if [[ " $COMPS " == *" clang23 "* ]]; then
            curl -fsSL --retry 5 -o tc/llvm-mingw-clang23.tar.xz \
              https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_STABLE/llvm-mingw-$LLVM_MINGW_STABLE-ucrt-ubuntu-22.04-x86_64.tar.xz
          fi
          for i in 1 2 3 4; do
            git clone -q --depth 1 --branch "$GIFLIB_REF" https://git.code.sf.net/p/giflib/code deps/giflib && break
            rm -rf deps/giflib; sleep 30
          done
          test -f deps/giflib/gif_lib.h
          git -C deps/giflib log -1 --format='giflib %H %ci'
          rm -rf deps/giflib/.git
          ls -l tc

      - uses: actions/upload-artifact@v4
        with:
          name: tc-llvm-mingw
          path: tc/
          retention-days: 3
          compression-level: 0
          if-no-files-found: ignore   # GCC-only selection

      - uses: actions/upload-artifact@v4
        with:
          name: deps
          path: deps/
          retention-days: 3

  gcc-toolchain:
    name: GCC cross toolchain (${{ matrix.tc.ver }})
    needs: resolve
    if: ${{ needs.resolve.outputs.gcc_toolchains != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      matrix:
        tc: ${{ fromJSON(needs.resolve.outputs.gcc_toolchains) }}
    steps:
      - uses: actions/checkout@v4

      - id: cache
        uses: actions/cache@v4
        with:
          path: ~/tc/mingw-${{ matrix.tc.name }}
          key: ${{ matrix.tc.key }}

      - name: Build the cross toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev libisl-dev
          WORK="$RUNNER_TEMP/gcc-work" bash ci/compiler-bench/build-gcc-mingw-cross.sh \
            "${{ matrix.tc.url }}" ~/tc/mingw-${{ matrix.tc.name }}

      - name: Toolchain info
        run: |
          ~/tc/mingw-${{ matrix.tc.name }}/bin/x86_64-w64-mingw32-gcc -v 2>&1 | tail -3
          du -sh ~/tc/mingw-${{ matrix.tc.name }}

  build:
    name: build ${{ matrix.compiler }}-${{ matrix.variant }}
    needs: [resolve, gcc-toolchain]
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}   # a failed toolchain fails only its builds
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: libwebp

      - name: Check out webp4j ${{ env.WEBP4J_REF }} (JNI glue + CMakeLists; its libwebp/ -> this repository)
        uses: actions/checkout@v4
        with:
          repository: MrNanko/webp4j
          ref: ${{ env.WEBP4J_REF }}
          persist-credentials: false   # no post-job submodule cleanup (libwebp/ becomes a symlink)
          path: webp4j

      - uses: ./libwebp/.github/actions/cross-toolchain
        with:
          compiler: ${{ matrix.compiler }}
          toolchains: ${{ needs.resolve.outputs.gcc_toolchains }}

      - name: Cross-build webp4j-windows-x64.dll + webp_bench.exe
        env:
          WEBP4J_SRC: ${{ github.workspace }}/webp4j
          GIFLIB_SRC: ${{ github.workspace }}/deps/giflib
        run: |
          set -euo pipefail
          bash libwebp/ci/compiler-bench/build-variant.sh "${{ startsWith(matrix.compiler, 'gcc') && 'gcc' || 'clang' }}" \
            ${{ matrix.variant }} dist/${{ matrix.compiler }}-${{ matrix.variant }}
          cut -c1-400 dist/*/compile-cmds.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ endsWith(matrix.variant, '-pgogen') && 'pgogen' || 'bin' }}-${{ matrix.compiler }}-${{ matrix.variant }}
          path: dist/${{ matrix.compiler }}-${{ matrix.variant }}/

  pgo-train:
    name: PGO training ${{ matrix.compiler }}
    needs: [resolve, build]
    if: ${{ !cancelled() && needs.resolve.outputs.pgo != '[]' }}   # independent of the other builds
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        compiler: ${{ fromJSON(needs.resolve.outputs.pgo) }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out webp4j ${{ env.WEBP4J_REF }} (training images)
        uses: actions/checkout@v4
        with:
          repository: MrNanko/webp4j
          ref: ${{ env.WEBP4J_REF }}
          path: webp4j
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/download-artifact@v4
        with:
          name: pgogen-${{ matrix.compiler }}-avx2-lto-pgogen
          path: gen

      - name: Run the instrumented webp_bench on the training images
        shell: bash
        run: |
          set -euo pipefail
          cat gen/info.txt
          python -m pip install --quiet pillow
          mkdir prof
          P=$(cygpath -m "$PWD/prof")
          # GCC: /tmp/pgo/<name>.gcda (PGO_DIR) -> prof/<name>.gcda; Clang: one .profraw per process
          export GCOV_PREFIX="$P" GCOV_PREFIX_STRIP=2 LLVM_PROFILE_FILE="$P/webp-%p.profraw"
          mapfile -t IMAGES < <(bash ci/compiler-bench/corpus.sh train)
          printf 'training image: %s\n' "${IMAGES[@]}"
          python ci/compiler-bench/bench.py --train gen/webp_bench.exe --images "${IMAGES[@]}" --out train
          ls prof | head
          echo "$(ls prof | wc -l) profile files"
          test -n "$(ls prof)"

      - uses: actions/upload-artifact@v4
        with:
          name: profile-${{ matrix.compiler }}
          path: prof/

  pgo-use:
    name: build ${{ matrix.compiler }}-avx2-lto-pgo
    needs: [resolve, gcc-toolchain, pgo-train]
    if: ${{ !cancelled() && needs.resolve.outputs.pgo != '[]' }}   # independent of the other builds
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        compiler: ${{ fromJSON(needs.resolve.outputs.pgo) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: libwebp

      - name: Check out webp4j ${{ env.WEBP4J_REF }}
        uses: actions/checkout@v4
        with:
          repository: MrNanko/webp4j
          ref: ${{ env.WEBP4J_REF }}
          path: webp4j
          persist-credentials: false

      - uses: ./libwebp/.github/actions/cross-toolchain
        with:
          compiler: ${{ matrix.compiler }}
          toolchains: ${{ needs.resolve.outputs.gcc_toolchains }}

      - uses: actions/download-artifact@v4
        with:
          name: profile-${{ matrix.compiler }}
          path: /tmp/pgo

      - name: Cross-build with the training profile
        env:
          WEBP4J_SRC: ${{ github.workspace }}/webp4j
          GIFLIB_SRC: ${{ github.workspace }}/deps/giflib
          PGO_DIR: /tmp/pgo
        run: |
          set -euo pipefail
          if ls /tmp/pgo/*.profraw > /dev/null 2>&1; then
            llvm-profdata merge -o /tmp/pgo/webp.profdata /tmp/pgo/*.profraw
            llvm-profdata show /tmp/pgo/webp.profdata | tail -3
          else
            echo "$(ls /tmp/pgo/*.gcda | wc -l) .gcda files"
          fi
          bash libwebp/ci/compiler-bench/build-variant.sh "${{ startsWith(matrix.compiler, 'gcc') && 'gcc' || 'clang' }}" \
            avx2-lto-pgo dist/${{ matrix.compiler }}-avx2-lto-pgo
          cut -c1-400 dist/*/compile-cmds.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.compiler }}-avx2-lto-pgo
          path: dist/${{ matrix.compiler }}-avx2-lto-pgo/

  test:
    name: test ${{ matrix.compiler }}-${{ matrix.variant }}
    needs: [resolve, build, pgo-use]
    if: ${{ !cancelled() }}   # test whatever built (a failed build's test fails at its artifact download)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.tested) }}
    steps:
      - name: Check out webp4j ${{ env.WEBP4J_REF }} (tests)
        uses: actions/checkout@v4
        with:
          repository: MrNanko/webp4j
          ref: ${{ env.WEBP4J_REF }}
          persist-credentials: false   # no post-job submodule cleanup (libwebp/ becomes a symlink)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
          cache: maven

      - uses: actions/download-artifact@v4
        with:
          name: bin-${{ matrix.compiler }}-${{ matrix.variant }}
          path: xbuild

      - name: Run webp4j's JUnit suite against the cross-built DLL
        shell: bash
        run: |
          set -eux
          cat xbuild/info.txt
          mkdir -p src/main/resources/native
          test -z "$(ls -A src/main/resources/native)"   # nothing else that could be loaded instead
          cp xbuild/webp4j-windows-x64.dll src/main/resources/native/
          mvn -B -ntp test

      - name: Mark the build as tested
        shell: bash
        run: mkdir ok && cp xbuild/info.txt ok/

      - uses: actions/upload-artifact@v4
        with:
          name: ok-${{ matrix.compiler }}-${{ matrix.variant }}
          path: ok/

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-${{ matrix.compiler }}-${{ matrix.variant }}
          path: target/surefire-reports/

  bench:
    name: benchmark (all builds, one runner)
    needs: [resolve, build, pgo-use]
    if: ${{ !cancelled() && format('{0}', inputs.bench) != 'false' }}   # unset (push) = run
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Check out webp4j ${{ env.WEBP4J_REF }} (test images)
        uses: actions/checkout@v4
        with:
          repository: MrNanko/webp4j
          ref: ${{ env.WEBP4J_REF }}
          persist-credentials: false   # no post-job submodule cleanup (libwebp/ becomes a symlink)
          path: webp4j

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist

      - name: Benchmark
        shell: bash
        env:
          ROUNDS: ${{ inputs.rounds || '5' }}
        run: |
          set -euo pipefail
          for d in dist/bin-*; do mv "$d" "dist/${d#dist/bin-}"; done
          for d in dist/*/; do echo "== $d"; cat "$d/info.txt"; done
          python -m pip install --quiet pillow
          mapfile -t IMAGES < <(bash ci/compiler-bench/corpus.sh bench)
          python ci/compiler-bench/bench.py --builds-dir dist --images "${IMAGES[@]}" --rounds "$ROUNDS" \
            --min-time 0.5 --baseline gcc17-base --out bench-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: |
            bench-results/
            !bench-results/corpus/*.rawi
