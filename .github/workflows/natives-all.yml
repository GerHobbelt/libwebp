name: webp4j natives, all platforms (Linux/macOS/Windows arm64 PGO builds + Windows x64) - build, test, release

# Builds the webp4j JNI library (drop-in for dev.matrixlab.webp4j:webp4j-core, libwebp = this
# repository, giflib static) natively on a GitHub runner of each platform, with the optimizations of
# the Windows x64 release winner clang-*-avx2-lto-pgo (.github/workflows/natives-windows-x64.yml):
#   platform         runner            file                         compiler            flags
#   linux-x64        ubuntu-22.04      libwebp4j-linux-x64.so       Clang (apt.llvm.org) -O3 -march=x86-64-v3 -ffast-math -flto
#   linux-aarch64    ubuntu-22.04-arm  libwebp4j-linux-aarch64.so   Clang (apt.llvm.org) -O3 -ffast-math -flto
#   mac-x64          macos-15-intel    libwebp4j-mac-x64.dylib      Xcode clang          -O3 -march=x86-64-v3 -ffast-math -flto, macOS 10.13+
#   mac-arm64        macos-14          libwebp4j-mac-arm64.dylib    Xcode clang          -O3 -ffast-math -flto, macOS 11.0+
#   windows-aarch64  windows-11-arm    webp4j-windows-aarch64.dll   llvm-mingw (native)  -O3 -ffast-math -flto, -static
# + PGO everywhere: an instrumented build (pgogen) of webp_bench, linked against the same libwebp
# objects, is trained natively on the images of 'ci/compiler-bench/corpus.sh train' (the training set of
# the Windows x64 build, converted once on Windows), then the profile-use build is shipped.
# Linux builds on ubuntu-22.04 so the glibc floor stays <= 2.35. Every library is checked
# (ci/compiler-bench/build-native.sh: JNI exports, dependencies) and runs webp4j's JUnit suite on the
# runner's native JVM.
# Release: run with 'release' checked or push a tag 'natives-all-*' -> GitHub release
# natives-all-<YYYYMMDD> (or the tag) with the five libraries + webp4j-windows-x64.dll of release
# natives-win-x64-20261013 + info-<platform>.txt + SHA256SUMS. Platforms whose job failed are left out.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release natives-all-<YYYYMMDD> with the results'
        type: boolean
        default: false
  push:
    tags: ['natives-all-*']

permissions:
  contents: read

concurrency:
  group: natives-all-${{ github.ref }}
  cancel-in-progress: true

env:
  WEBP4J_REF: 'v2.5.0'
  GIFLIB_REF: '5.2.2'
  LLVM_VER: '23'                                # apt.llvm.org (Linux)
  LLVM_MINGW_VER: '20261006'                    # llvm-mingw release, LLVM 23.1.3 (Windows arm64)
  WIN_X64_RELEASE: 'natives-win-x64-20261013'   # source of webp4j-windows-x64.dll

jobs:
  prep:
    name: PGO training corpus + giflib sources
    runs-on: windows-latest   # the training images of corpus.sh are the Windows wallpapers
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check out webp4j ${{ env.WEBP4J_REF }} (training images)
        uses: actions/checkout@v4
        with:
          repository: MrNanko/webp4j
          ref: ${{ env.WEBP4J_REF }}
          path: webp4j
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Convert the training images to .rawi (bench.py's corpus format)
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          mapfile -t IMAGES < <(bash ci/compiler-bench/corpus.sh train)
          printf 'training image: %s\n' "${IMAGES[@]}"
          python - "${IMAGES[@]}" <<'EOF'
          import sys
          sys.path.insert(0, "ci/compiler-bench")
          import bench
          bench.make_corpus(sys.argv[1:], "corpus", 4.0)
          EOF
          ls -l corpus
          test "$(ls corpus/*.rawi | wc -l)" -ge 3

      - name: giflib ${{ env.GIFLIB_REF }} sources
        run: |
          set -euo pipefail
          for i in 1 2 3 4; do
            git -c core.autocrlf=false clone -q --depth 1 --branch "$GIFLIB_REF" https://git.code.sf.net/p/giflib/code deps/giflib && break
            rm -rf deps/giflib; sleep 30
          done
          test -f deps/giflib/gif_lib.h
          git -C deps/giflib log -1 --format='giflib %H %ci'
          rm -rf deps/giflib/.git

      - uses: actions/upload-artifact@v4
        with:
          name: pgo-corpus
          path: corpus/
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: deps
          path: deps/
          retention-days: 3

  build:
    name: ${{ matrix.platform }}
    needs: prep
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,       runner: ubuntu-22.04,     lib: libwebp4j-linux-x64.so,     jdk: temurin,   arch: x64,     pgo: true }
          - { platform: linux-aarch64,   runner: ubuntu-22.04-arm, lib: libwebp4j-linux-aarch64.so, jdk: temurin,   arch: aarch64, pgo: true }
          - { platform: mac-x64,         runner: macos-15-intel,   lib: libwebp4j-mac-x64.dylib,    jdk: temurin,   arch: x64,     pgo: true }
          - { platform: mac-arm64,       runner: macos-14,         lib: libwebp4j-mac-arm64.dylib,  jdk: temurin,   arch: aarch64, pgo: true }
          - { platform: windows-aarch64, runner: windows-11-arm,   lib: webp4j-windows-aarch64.dll, jdk: microsoft, arch: aarch64, pgo: true }
    env:
      WEBP4J_SRC: ${{ github.workspace }}/webp4j
      GIFLIB_SRC: ${{ github.workspace }}/deps/giflib
      PGO_DIR: ${{ github.workspace }}/pgo
    steps:
      - uses: actions/checkout@v4
        with:
          path: libwebp

      - name: Check out webp4j ${{ env.WEBP4J_REF }} (JNI glue + CMakeLists + tests; its libwebp/ -> this repository)
        uses: actions/checkout@v4
        with:
          repository: MrNanko/webp4j
          ref: ${{ env.WEBP4J_REF }}
          path: webp4j
          persist-credentials: false   # no post-job submodule cleanup (libwebp/ is replaced)

      - uses: actions/download-artifact@v4
        with:
          name: deps
          path: deps

      - uses: actions/download-artifact@v4
        if: matrix.pgo
        with:
          name: pgo-corpus
          path: corpus

      - name: Set up JDK 21 (${{ matrix.jdk }}, ${{ matrix.arch }}; jni.h + the JUnit run)
        uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.jdk }}
          java-version: '21'
          architecture: ${{ matrix.arch }}
          cache: maven
          cache-dependency-path: webp4j/pom.xml

      - name: Toolchain (Linux) - LLVM ${{ env.LLVM_VER }} from apt.llvm.org, Ninja
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")
          curl -fsSL --retry 5 https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$CODENAME/ llvm-toolchain-$CODENAME-$LLVM_VER main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends clang-$LLVM_VER lld-$LLVM_VER llvm-$LLVM_VER \
            libclang-rt-$LLVM_VER-dev ninja-build
          echo "/usr/lib/llvm-$LLVM_VER/bin" >> "$GITHUB_PATH"

      - name: Toolchain (macOS) - Xcode clang, Ninja
        if: runner.os == 'macOS'
        run: |
          command -v ninja > /dev/null || brew install ninja
          xcode-select -p
          xcrun --find llvm-profdata

      - name: Toolchain (Windows arm64) - llvm-mingw ${{ env.LLVM_MINGW_VER }} (native aarch64 host)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:LLVM_MINGW_VER
          $zip = "$env:RUNNER_TEMP\llvm-mingw.zip"
          curl.exe -fsSL --retry 5 -o $zip "https://github.com/mstorsjo/llvm-mingw/releases/download/$v/llvm-mingw-$v-ucrt-aarch64.zip"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force C:\llvm-mingw-root | Out-Null
          tar.exe -xf $zip -C C:\llvm-mingw-root
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $dir = (Get-ChildItem C:\llvm-mingw-root -Directory | Select-Object -First 1).FullName
          "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Toolchain info, Maven; point webp4j/libwebp to this repository
        run: |
          set -eu +o pipefail   # '| head' may close a pipe early
          case "${{ matrix.platform }}" in windows-*) CC=aarch64-w64-mingw32-clang ;; *) CC=clang ;; esac
          command -v $CC
          $CC --version
          cmake --version | head -1
          echo "ninja $(ninja --version)"
          java -version 2>&1 | head -2
          if ! command -v mvn > /dev/null; then   # not on every runner image
            curl -fsSL --retry 5 https://archive.apache.org/dist/maven/maven-3/3.9.11/binaries/apache-maven-3.9.11-bin.tar.gz | tar -xz -C "$HOME"
            echo "$HOME/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"
            "$HOME/apache-maven-3.9.11/bin/mvn" -v | head -1
          else
            mvn -v | head -1
          fi
          rm -rf webp4j/libwebp
          if [ "$RUNNER_OS" = Windows ]; then cp -R libwebp webp4j/libwebp; else ln -s "$PWD/libwebp" webp4j/libwebp; fi
          test -f webp4j/libwebp/src/webp/encode.h

      - name: Build (lto, no PGO)
        if: ${{ !matrix.pgo }}
        run: bash libwebp/ci/compiler-bench/build-native.sh ${{ matrix.platform }} lto dist/ship

      - name: PGO 1/3 - instrumented build (pgogen)
        if: matrix.pgo
        run: |
          bash libwebp/ci/compiler-bench/build-native.sh ${{ matrix.platform }} pgogen dist/pgogen
          cut -c1-400 dist/pgogen/compile-cmds.txt

      - name: PGO 2/3 - train the instrumented webp_bench on the corpus (natively)
        if: matrix.pgo
        run: |
          set -euo pipefail
          wp() { if command -v cygpath > /dev/null; then cygpath -m "$1"; else printf '%s\n' "$1"; fi; }
          P=$(wp "$PGO_DIR")
          rm -rf "$P" train && mkdir -p "$P" train
          export LLVM_PROFILE_FILE="$P/webp-%p.profraw"
          BENCH=dist/pgogen/webp_bench
          if [ -f "$BENCH.exe" ]; then BENCH=$BENCH.exe; fi
          ls -l corpus
          "$BENCH" -t 0 -o train corpus/*.rawi    # encode (+ lossless round trip), writes q75 + lossless .webp
          "$BENCH" -t 0 train/*.webp              # decode them
          ls -l "$P"
          if [ "$RUNNER_OS" = macOS ]; then PROFDATA="xcrun llvm-profdata"; else PROFDATA=llvm-profdata; fi
          $PROFDATA merge -o "$P/webp.profdata" "$P"/*.profraw
          $PROFDATA show "$P/webp.profdata" | tail -4

      - name: PGO 3/3 - profile-use build
        if: matrix.pgo
        run: |
          bash libwebp/ci/compiler-bench/build-native.sh ${{ matrix.platform }} pgo dist/ship
          cut -c1-400 dist/ship/compile-cmds.txt

      - name: webp4j JUnit suite against ${{ matrix.lib }} (native JVM)
        working-directory: webp4j
        run: |
          set -eux
          mkdir -p src/main/resources/native
          test -z "$(ls -A src/main/resources/native)"   # nothing else that could be loaded instead
          cp ../dist/ship/${{ matrix.lib }} src/main/resources/native/
          mvn -B -ntp test

      - name: Collect ${{ matrix.lib }} + info-${{ matrix.platform }}.txt
        run: |
          mkdir out
          cp dist/ship/${{ matrix.lib }} out/
          cp dist/ship/info.txt out/info-${{ matrix.platform }}.txt
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: out/

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ matrix.platform }}
          path: |
            dist/*/*.log
            dist/*/*.txt
            webp4j/target/surefire-reports/
          if-no-files-found: ignore

  release:
    name: release natives-all
    needs: build
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/natives-all-') || inputs.release) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: a
          merge-multiple: true

      - name: Assemble the release (+ webp4j-windows-x64.dll of ${{ env.WIN_X64_RELEASE }})
        id: asm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir rel x64
          ls -l a
          test -n "$(ls a/info-*.txt 2>/dev/null)" || { echo "::error::no platform build succeeded"; exit 1; }
          cp a/* rel/
          gh release download "$WIN_X64_RELEASE" -R "$GITHUB_REPOSITORY" -D x64 \
            -p webp4j-windows-x64.dll -p SHA256SUMS -p 'info-*.txt'
          (cd x64 && grep -E ' \*?webp4j-windows-x64\.dll$' SHA256SUMS | sha256sum -c -)
          # the build behind webp4j-windows-x64.dll: the per-build DLL with the same hash
          H=$(sha256sum x64/webp4j-windows-x64.dll | cut -d' ' -f1)
          X=$(grep "^$H " x64/SHA256SUMS | grep -oE 'webp4j-windows-x64-.+\.dll' | head -1)
          X=${X#webp4j-windows-x64-}; X=${X%.dll}
          test -f "x64/info-$X.txt"
          cp x64/webp4j-windows-x64.dll rel/
          {
            echo "platform: windows-x64"
            echo "file:     webp4j-windows-x64.dll"
            echo "release:  $WIN_X64_RELEASE (build $X, cross-built, benchmarked and tested by natives-windows-x64.yml)"
            echo "pgo:      $(grep -q -- '-fprofile-use' "x64/info-$X.txt" && echo yes || echo no)"
            cat "x64/info-$X.txt"
            echo "requires: Windows 10+ x64 (UCRT); x86-64-v3 CPU (AVX2/FMA/BMI2: Intel Haswell / AMD Zen 1 or newer)"
          } > rel/info-windows-x64.txt
          (cd rel && sha256sum * > SHA256SUMS)
          if [[ "$GITHUB_REF" == refs/tags/natives-all-* ]]; then TAG=${GITHUB_REF#refs/tags/}
          else TAG="natives-all-$(date -u +%Y%m%d)"; fi
          field() { grep -m1 "^$1:" "$2" | cut -d: -f2- | sed 's/^ *//'; }
          {
            echo "webp4j $WEBP4J_REF JNI libraries for six platforms: drop-in for \`dev.matrixlab.webp4j:webp4j-core\`"
            echo "(file names as its \`NativeLibraryLoader\` expects; put a file at \`/native/<name>\` on the classpath)."
            echo "libwebp = this repository \`${GITHUB_SHA::7}\`, giflib $GIFLIB_REF linked statically."
            echo
            echo "| platform | file | compiler | flags | PGO | dependencies | requires |"
            echo "|---|---|---|---|---|---|---|"
            for p in linux-x64 linux-aarch64 mac-x64 mac-arm64 windows-x64 windows-aarch64; do
              f=rel/info-$p.txt
              if [ ! -f "$f" ]; then echo "| $p | *not built in this run* | | | | | |"; continue; fi
              flags=$(field flags "$f" | sed -E 's/ -fprofile-use=[^ ]*//; s/ -Wno-profile-instr-[a-z-]*//g')
              deps=$(field deps "$f"); [ -n "$deps" ] || deps=$(field imports "$f")
              echo "| $p | \`$(field file "$f")\` | $(field compiler "$f" | sed -E 's/ \(.*//') | \`$flags\` | $(field pgo "$f") | $deps | $(field requires "$f") |"
            done
            echo
            echo "**CPU:** the x64 files (\`*-x64.*\`) are built with \`-march=x86-64-v3\` and need an AVX2/FMA/BMI2 CPU"
            echo "(Intel Haswell / AMD Zen 1 or newer); the aarch64/arm64 files run on any 64-bit ARMv8-A CPU."
            echo
            echo "* PGO: an instrumented build of \`webp_bench\` (linked against the same libwebp objects) was trained on"
            echo "  each platform's own runner with the images of \`ci/compiler-bench/corpus.sh train\`, then the library was"
            echo "  rebuilt with the profile (\`-fprofile-use\`)."
            echo "* Tests: every library passed webp4j's JUnit suite on a native JVM of its platform (Windows x64: in"
            echo "  [$WIN_X64_RELEASE](https://github.com/$GITHUB_REPOSITORY/releases/tag/$WIN_X64_RELEASE), which also has its benchmark)."
            echo "* Linking: Linux \`-static-libgcc\` (only glibc), macOS only system libraries (ad-hoc signed),"
            echo "  Windows \`-static\` (only KERNEL32 + the UCRT). Build details per platform: \`info-<platform>.txt\`."
            echo "* Built by [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) (\`.github/workflows/natives-all.yml\`)."
            echo
            echo '```'; cat rel/SHA256SUMS; echo '```'
          } > notes.md
          cat notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          ls -l rel

      - name: Publish (create or update)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.asm.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" rel/* -R "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$TAG" rel/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "webp4j natives, all platforms ($TAG)" --notes-file notes.md
          fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[] | "\(.name) \(.size)")'
